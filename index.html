<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Temporary Lost Confessions</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div id="screen">
        <div id="world">
            <div id="freeze"></div>
            <div id="inventory" style="background-image: url('imgs/inventory.png');">
            </div>
            <div class="room" id="bedroom" style="background-image: url('imgs/room/bedroom.png');"></div>
            <div class="room" id="flowerRoom" style="background-image: url('imgs/room/flowerRoom.png');"></div>
            <div class="room" id="escalatorRoom" style="background-image: url('imgs/room/escalatorRoom.png');"></div>
            <div class="room" id="bentHallway" style="background-image: url('imgs/room/bentHallway.png')"></div>
            <div class="room" id="mallRoom" style="background-image: url('imgs/room/mallRoom.png')"></div>
            <div class="room" id="museumRoom" style="background-image: url('imgs/room/museumRoom.png')"></div>
            <div class="room" id="swanRoom" style="background-image: url('imgs/room/swanRoom.png')"></div>
            <div class="room" id="gatchaRoom" style="background-image: url('imgs/room/gatchaRoom.png')"></div>
            <div class="room" id="subwayRoom" style="background-image: url('imgs/room/subwayRoom.png')"></div>
            <div class="room" id="gummyRoom" style="background-image: url('imgs/room/gummyRoom.png')"></div>
            <div class="room" id="classroom" style="background-image: url('imgs/room/classroom.png')"></div>
            <div class="room" id="butterflyRoom" style="background-image: url('imgs/room/butterflyRoom.png')"></div>
            <div id="textBox">
                <img src="imgs/textBox.png">
                <div id="textBoxText"></div>
                <div id="arrow"></div>
                <div id="textBoxConfirm">
                    <div id="textBoxConfirmYes">Yes</div>
                    <div id="textBoxConfirmNo">No</div>
                </div>
            </div>
            <div id="zoom">
                <div id="zoomContainer">
                    <img id="zoomImg" src="">
                    <pre id="diaryText"></pre>
                </div>
            </div>

        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>

</html>
