<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Temporary Lost Confessions</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div id="screen">
        <div id="world">
            <div id="freeze"></div>
            <div id="inventory" style="background-image: url('imgs/inventory.png');">
            </div>
            <div class="room" id="bedroom" style="background-image: url('imgs/room/bedroom.png');"></div>
            <div class="room" id="flowerRoom" style="background-image: url('imgs/room/flowerRoom.png');"></div>
            <div class="room" id="escalatorRoom" style="background-image: url('imgs/room/escalatorRoom.png');"></div>
            <div class="room" id="bentHallway" style="background-image: url('imgs/room/bentHallway.png')"></div>

            <div id="textBox">
                <img src="imgs/textBox.png">
                <div id="textBoxText"></div>
                <div id="arrow"></div>
                <div id="textBoxConfirm">
                    <div id="textBoxConfirmYes">Yes</div>
                    <div id="textBoxConfirmNo">No</div>
                </div>
            </div>
            <div id="zoom">
                <img id="zoomImg" src="">
            </div>

        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>

</html>
