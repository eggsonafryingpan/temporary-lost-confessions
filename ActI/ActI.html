<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>TLC</title>
    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reenie+Beanie&display=swap" rel="stylesheet">
</head>

<body>
    <div id="screen">
        <div id="world">
            <div id = "pause" class = "hidden"> </div>
            <div class="room" id="bedroom2" style="background-image: url('imgs/bedroom2.png');"> </div>
            <div class="room" id="hallway" style="background-image: url('imgs/hallway.png');"> </div>
            <div class="room" id="library" style="background-image: url('imgs/library.png');"></div>
            <div class="room" id="aquarium" style="background-image: url('imgs/aquarium.png');"></div>
            <div class="room" id="beach" style="background-image: url('imgs/beach.png');"></div>
            <div class="room" id="hills" style="background-image: url('imgs/hills.png');"></div>
            <div class="room" id="stairwell" style="background-image: url('imgs/stairwell.png');"></div>
            <div class="room" id="stairwell2" style="background-image: url('imgs/stairwell2.png');"></div>
            <div class="room" id="paintingWall" style="background-image: url('imgs/paintingWall.png');"></div>
            <div class="room" id="gardenL" style="background-image: url('imgs/gardenL.png');"></div>
            <div class="room" id="gardenR" style="background-image: url('imgs/gardenR.png');"></div>
            <div class="room" id="spaceView" style="background-image: url('imgs/spaceView.png');"></div>
            <div class="room" id="space" style="background-image: url('imgs/space.png');"></div>
            <div class="room" id="finale" style="background-image: url('imgs/finale.png');"></div>







            <!-- <div class="room" id="hallway" style="background-image: url('imgs/hallway.png')"></div> -->

            
            <div id="inventory" style="background-image: url('imgs/inventory.png');"></div>

            <div id="textBox">
                <img src="imgs/textBox.png">
                <div id="textBoxText"></div>
                <div id="arrow"></div>
                <div id="textBoxConfirm">
                    <div id="textBoxConfirmYes">Yes</div>
                    <div id="textBoxConfirmNo">No</div>
                </div>
            </div>
            <div id="zoom">
                <div id="zoomContent">
                <img id="zoomImg" src="">
                <pre id="diaryText"></pre>

                <div id="display" class="tiny5-regular">----</div>
                
                <div id="keypad">
                    <div id="keys" class="tiny5-regular">
                        <button>1</button><button>2</button><button>3</button>
                        <button>4</button><button>5</button><button>6</button>
                        <button>7</button><button>8</button><button>9</button>
                        <button>X</button>
                        <button>0</button>
                        <button>✓</button>
                    </div>
                    <div id="key" class="tiny5-regular">
                        <button>EXIT</button>
                    </div>
                    

                    
                </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>

</html>
